<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0c29">
    <meta name="description" content="Rhinestone Factory Billing Calculator">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rhinestone Calculator">
    <title>Rhinestone Calculator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon-512.svg" sizes="512x512" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/icon-512.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.6); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
        }

        .animated-bg {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 100%;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-hover {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-hover::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-hover:hover::before {
            left: 100%;
        }

        .btn-hover:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            outline: none;
        }

        .input-item-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .title-badge {
            font-weight: 700;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .metric-chip {
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.78rem;
            color: #dfe8ff;
            white-space: nowrap;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #dfe8ff;
        }

        .price-badge {
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .price-input {
            width: auto;
            min-width: 80px;
            max-width: 110px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            text-align: center;
            font-weight: 600;
        }

        .price-input:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(124, 58, 237, 0.7);
            outline: none;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        .total-pill {
            padding: 8px 10px;
            border-radius: 999px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #ffffff;
        }

        .applic-card {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .applic-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .applic-title {
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
        }

        .applic-subtitle {
            font-size: 0.8rem;
            color: #ced6ff;
            margin-top: 2px;
        }

        .applic-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .applic-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .applic-label {
            font-size: 0.8rem;
            color: #dfe8ff;
            font-weight: 600;
        }

        .applic-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-chip {
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: #e8eeff;
            font-size: 0.8rem;
        }

        .stat-chip.accent {
            background: rgba(124, 58, 237, 0.2);
            color: #f3ebff;
        }

        .checkbox-custom {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .checkbox-custom:checked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            animation: pulse-glow 2s infinite;
        }

        .checkbox-custom:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .slide-in {
            animation: slideIn 0.5s ease forwards;
        }

        #main {
            width: 100%;
            max-width: 100%;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        #inputs {
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            grid-auto-rows: auto;
        }

        .input-field {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .total-glow,
        .glass-card {
            box-sizing: border-box;
        }

        .checkbox-custom {
            min-width: 18px;
            min-height: 18px;
        }

        @media (max-width: 600px) {
            #main {
                padding-left: 12px;
                padding-right: 12px;
                gap: 12px;
            }

            nav {
                padding-left: 12px;
                padding-right: 12px;
            }

            nav > div {
                gap: 8px;
            }

            .glass-card {
                padding: 14px;
            }

            .glass-card.rounded-2xl.p-5,
            .glass-card.rounded-2xl.p-4 {
                padding: 14px;
            }

            .btn-hover {
                padding: 0;
            }

            .slide-in {
                animation: slideIn 0.4s ease forwards;
            }

            #inputs {
                gap: 12px;
                grid-template-columns: 1fr;
            }

            .applic-grid {
                grid-template-columns: 1fr;
            }

            .applic-header {
                flex-direction: column;
            }

            .input-item-card {
                padding: 12px;
            }

            .flex {
                gap: 10px;
            }

            .flex-wrap {
                gap: 10px;
            }

            .input-field {
                padding: 10px 12px;
            }

            .total-glow.rounded-2xl.p-6 {
                padding: 14px;
            }
        }

        .total-glow {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientBG 5s ease infinite;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="w-full glass-card py-4 px-6 flex items-center justify-between fixed top-0 left-0 z-50">
        <div class="flex items-center gap-3">
            <img src="images/icon-512.svg" alt="App Icon" class="w-10 h-10 rounded-lg object-cover">
            <div>
                <h1 class="text-white text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">Rhinestone Calculator</h1>
                <p class="text-gray-400 text-xs">Ali Khatri Codes</p>
            </div>
        </div>
        <div class="flex gap-3">
            <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                <input type="checkbox" id="applicToggle" class="checkbox-custom" onchange="toggleApplic()">
                Applic
            </label>
            <button id="openSettings" type="button" class="text-white text-3xl btn-hover p-2 rounded-xl glass-card">⚙️</button>
        </div>
    </nav>

    <div id="main" class="w-full min-h-screen animated-bg flex items-center justify-center flex-col gap-4 p-7 pt-24 overflow-y-auto">
        <!-- Header -->
        <div class="w-full flex justify-between items-center mb-2 slide-in">
            <div>
                <h2 class="text-white text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">Calculator</h2>
                <p class="text-gray-400 text-sm mt-1">Rhinestone Factory Billing Calculator</p>
            </div>
        </div>

        <!-- SS Row -->
        <div class="w-full glass-card rounded-2xl p-5 slide-in" style="animation-delay: 0.1s;">
            <h3 class="text-white text-lg font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">SS Items</h3>
            <div class="flex gap-4 flex-wrap">
                <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                    <input type="checkbox" name="item" value="6SS" class="checkbox-custom" onchange="handleSelection()">
                    6SS
                </label>
                <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                    <input type="checkbox" name="item" value="10SS" class="checkbox-custom" onchange="handleSelection()">
                    10SS
                </label>
                <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                    <input type="checkbox" name="item" value="16SS" class="checkbox-custom" onchange="handleSelection()">
                    16SS
                </label>
            </div>
        </div>

        <!-- Chorsi Row -->
        <div class="w-full glass-card rounded-2xl p-5 slide-in" style="animation-delay: 0.2s;">
            <h3 class="text-white text-lg font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-400">Chorsi Items</h3>
            <div class="flex gap-4 flex-wrap">
                <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                    <input type="checkbox" name="item" value="4x4" class="checkbox-custom" onchange="handleSelection()">
                    4/4 Chorsi
                </label>
                <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                    <input type="checkbox" name="item" value="6x6" class="checkbox-custom" onchange="handleSelection()">
                    6/6 Chorsi
                </label>
            </div>
        </div>

        <!-- Tube Row -->
        <div class="w-full glass-card rounded-2xl p-5 slide-in" style="animation-delay: 0.3s;">
            <h3 class="text-white text-lg font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-orange-400">Tube Items</h3>
            <div class="flex gap-4 flex-wrap">
                <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                    <input type="checkbox" name="item" value="2.5x5" class="checkbox-custom" onchange="handleSelection()">
                    2.5/5 Tube
                </label>
                <label class="flex items-center gap-2 text-white text-sm glass-card px-4 py-2 rounded-xl cursor-pointer btn-hover">
                    <input type="checkbox" name="item" value="3x7" class="checkbox-custom" onchange="handleSelection()">
                    3/7 Tube
                </label>
            </div>
        </div>

        <!-- Inputs Section -->
        <div id="inputs" class="w-full glass-card rounded-2xl p-2 grid gap-2 slide-in" style="animation-delay: 0.4s; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); grid-auto-rows: auto;">
            
        </div>

        <!-- Total Section -->
        <div class="w-full total-glow rounded-2xl p-6 text-white slide-in" style="animation-delay: 0.5s;">
            <h2 class="text-xl font-bold mb-3">Total</h2>
            <div class="text-4xl font-bold" id="grandTotal">0.00</div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-70 items-center justify-center z-50 backdrop-blur-sm" style="display:none;">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md mx-4 slide-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-white text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">Settings</h2>
                <button id="closeSettings" type="button" class="text-white text-2xl btn-hover p-2 rounded-xl glass-card">✕</button>
            </div>
            <div id="settingsContent" class="space-y-4">
                <!-- Settings items will be added here -->
            </div>
            <div class="flex gap-3 mt-6">
                <button id="saveSettings" type="button" class="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-xl font-bold btn-hover">Apply Prices</button>
                <button id="resetSettings" type="button" class="flex-1 glass-card text-white py-3 rounded-xl font-bold btn-hover">Reset</button>
            </div>
        </div>
    </div>

    <script>
        const items = {
            '6SS': { name: '6SS', price: 0.03 },
            '10SS': { name: '10SS', price: 0.03 },
            '16SS': { name: '16SS', price: 0.05 },
            '4x4': { name: '4/4 Chorsi', price: 0.15 },
            '6x6': { name: '6/6 Chorsi', price: 0.25 },
            '2.5x5': { name: '2.5/5 Tube', price: 0.15 },
            '3x7': { name: '3/7 Tube', price: 0.25 },
            'applic': { name: 'Applic', price: 0 }
        };

        const state = {
            prices: {
                '6SS': 0.03,
                '10SS': 0.03,
                '16SS': 0.05,
                '4x4': 0.15,
                '6x6': 0.25,
                '2.5x5': 0.15,
                '3x7': 0.25
            },
            inchPrice: 2,
            qty: {},
            applic: {}
        };

        function loadSettings() {
            // session-only pricing, no persistent save
        }

        function saveSettings() {
            handleSelection();
            toggleSettings();
        }

        function toggleApplic() {
            handleSelection();
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                renderSettings();
            }
        }

        function renderSettings() {
            const content = document.getElementById('settingsContent');
            content.innerHTML = '';

            const applicDiv = document.createElement('div');
            applicDiv.className = 'glass-card p-4 rounded-xl mt-4';
            applicDiv.innerHTML = `
                <h3 class="text-white font-bold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400">Applic Price (per inch)</h3>
                <div class="flex items-center justify-between">
                    <label class="text-white text-sm">Price per inch (Rupa)</label>
                    <input type="number" id="inch-price" value="${state.inchPrice.toFixed(2)}" class="w-28 input-field text-white px-4 py-2 rounded-xl" step="0.01">
                </div>
            `;
            content.appendChild(applicDiv);
        }

        function handleSelection() {
            const inputsContainer = document.getElementById('inputs');
            inputsContainer.innerHTML = '';
            const checkedItems = document.querySelectorAll('input[name="item"]:checked');

            checkedItems.forEach(checkbox => {
                const itemKey = checkbox.value;
                if (itemKey === 'applic') return;
                const item = items[itemKey];
                const qtyValue = state.qty[itemKey] ?? 1;
                const inputDiv = document.createElement('div');
                inputDiv.className = 'glass-card rounded-xl p-3 slide-in w-full input-item-card';
                inputDiv.innerHTML = `
                    <div class="card-header">
                        <span class="title-badge">${item.name}</span>
                        <span class="metric-chip">Qty</span>
                    </div>
                    <input type="number" id="qty-${itemKey}" placeholder="Qty" class="w-full input-field text-white rounded-xl" value="${qtyValue}" min="0" step="1">
                    <div class="price-row">
                        <label for="price-${itemKey}">Price</label>
                        <input type="number" id="price-${itemKey}" value="${state.prices[itemKey].toFixed(2)}" min="0" step="0.01" class="price-input text-white">
                    </div>
                    <div class="total-pill" id="total-${itemKey}">Total: 0.00</div>
                `;
                inputsContainer.appendChild(inputDiv);
            });

            if (document.getElementById('applicToggle').checked) {
                const applicCard = document.createElement('div');
                applicCard.id = 'applic-input';
                applicCard.className = 'glass-card rounded-2xl p-3 slide-in w-full applic-card';
                applicCard.innerHTML = `
                    <div class="applic-header">
                        <div>
                            <div class="applic-title">Applic</div>
                            <div class="applic-subtitle">Add dimensions to calculate the applic price</div>
                        </div>
                        <span class="metric-chip">${state.inchPrice.toFixed(2)} / inch</span>
                    </div>
                    <div class="applic-grid">
                        <div class="applic-field">
                            <label class="applic-label" for="dimension1-applic">Dimension 1</label>
                            <input type="number" id="dimension1-applic" placeholder="Enter first size" class="w-full input-field text-white rounded-xl" value="${state.applic.dim1 || ''}" min="0" step="0.1">
                        </div>
                        <div class="applic-field">
                            <label class="applic-label" for="dimension2-applic">Dimension 2</label>
                            <input type="number" id="dimension2-applic" placeholder="Enter second size" class="w-full input-field text-white rounded-xl" value="${state.applic.dim2 || ''}" min="0" step="0.1">
                        </div>
                    </div>
                    <div class="applic-footer">
                        <span class="stat-chip">Inches <span id="total-inches-applic">0.00</span></span>
                        <span class="stat-chip accent">Rate <span id="price-per-inch-applic">${state.inchPrice.toFixed(2)}</span> Rupa</span>
                    </div>
                    <div class="total-pill" id="total-applic">Total: 0.00</div>
                `;
                inputsContainer.appendChild(applicCard);
            }

            calculateTotal();
        }

        function updateItemValue(itemKey) {
            const qtyInput = document.getElementById(`qty-${itemKey}`);
            if (qtyInput) {
                state.qty[itemKey] = parseFloat(qtyInput.value) || 0;
            }
            calculateTotal();
        }

        function updateItemPrice(itemKey) {
            const priceInput = document.getElementById(`price-${itemKey}`);
            if (priceInput) {
                state.prices[itemKey] = parseFloat(priceInput.value) || 0;
            }
            calculateTotal();
        }

        function calculateApplicDimensions() {
            const dim1 = parseFloat(document.getElementById('dimension1-applic')?.value) || 0;
            const dim2 = parseFloat(document.getElementById('dimension2-applic')?.value) || 0;
            const totalInches = (dim1 + dim2) / 2;
            state.applic = { dim1, dim2, totalInches };
            const inchesEl = document.getElementById('total-inches-applic');
            if (inchesEl) inchesEl.textContent = totalInches.toFixed(2);
            const rateEl = document.getElementById('price-per-inch-applic');
            if (rateEl) rateEl.textContent = state.inchPrice.toFixed(2);
            calculateTotal();
        }

        function calculateTotal() {
            let grandTotal = 0;
            document.querySelectorAll('input[name="item"]:checked').forEach(checkbox => {
                const itemKey = checkbox.value;
                if (itemKey === 'applic') return;
                const qty = parseFloat(document.getElementById(`qty-${itemKey}`)?.value) || 0;
                const itemTotal = qty * (state.prices[itemKey] || 0);
                const totalEl = document.getElementById(`total-${itemKey}`);
                if (totalEl) totalEl.textContent = `Total: ${itemTotal.toFixed(2)}`;
                grandTotal += itemTotal;
            });

            if (document.getElementById('applicToggle').checked) {
                const totalInches = state.applic.totalInches || 0;
                const applicTotal = totalInches * state.inchPrice;
                const totalEl = document.getElementById('total-applic');
                if (totalEl) totalEl.textContent = `Total: ${applicTotal.toFixed(2)}`;
                grandTotal += applicTotal;
            }

            document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
        }

        document.addEventListener('input', (event) => {
            if (event.target.id && event.target.id.startsWith('qty-')) {
                updateItemValue(event.target.id.replace('qty-', ''));
            }
            if (event.target.id && event.target.id.startsWith('price-')) {
                updateItemPrice(event.target.id.replace('price-', ''));
            }
            if (event.target.id === 'dimension1-applic' || event.target.id === 'dimension2-applic') {
                calculateApplicDimensions();
            }
        });

        document.addEventListener('change', (event) => {
            if (event.target.matches('input[name="item"]')) {
                handleSelection();
            }
            if (event.target.id === 'applicToggle') {
                handleSelection();
            }
        });

        const saveSettingsBtn = document.getElementById('saveSettings');
        if (saveSettingsBtn) {
            saveSettingsBtn.addEventListener('click', () => {
                const inchInput = document.getElementById('inch-price');
                if (inchInput) {
                    state.inchPrice = parseFloat(inchInput.value) || 0;
                }
                saveSettings();
            });
        }

        const resetSettingsBtn = document.getElementById('resetSettings');
        if (resetSettingsBtn) {
            resetSettingsBtn.addEventListener('click', () => {
                state.prices = {
                    '6SS': 0.03,
                    '10SS': 0.03,
                    '16SS': 0.05,
                    '4x4': 0.15,
                    '6x6': 0.25,
                    '2.5x5': 0.15,
                    '3x7': 0.25
                };
                state.inchPrice = 2;
                handleSelection();
                toggleSettings();
            });
        }

        const openSettingsBtn = document.getElementById('openSettings');
        if (openSettingsBtn) {
            openSettingsBtn.addEventListener('click', toggleSettings);
        }

        const closeSettingsBtn = document.getElementById('closeSettings');
        if (closeSettingsBtn) {
            closeSettingsBtn.addEventListener('click', toggleSettings);
        }

        loadSettings();
        handleSelection();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
            });
        }
    </script>
</body>
</html>
